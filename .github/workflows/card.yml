# Redraws the profile card (dark_mode.svg, light_mode.svg) from live GitHub data.
name: Refresh profile card

on:
  schedule:
    - cron: "15 4 * * *" # daily, 9:15 AM PKT
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/build_card.py", ".github/workflows/card.yml"]

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: true

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Draw the card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --with pillow python scripts/build_card.py
      - name: Commit if changed
        run: |
          git diff --quiet -- dark_mode.svg light_mode.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git commit -m "Refresh profile card"
          git push
